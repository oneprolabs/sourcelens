function openDetail(id,tab=0){if(!byId(id)){toast('该助手不存在，请返回列表。');openList();return;}if(state.view==='list'){state.listScroll=window.scrollY;state.listFocus='name-'+id;}state.id=id;state.detailTab=tab;state.view='detail';state.draft=null;renderDetail();window.scrollTo(0,0);focusHeading();}
function openForm(id=null,origin='list'){const a=id?byId(id):null;if(a&&a.status!=='active'){toast('归档助手需要恢复后才能编辑。');return;}if(state.view==='list'){state.listScroll=window.scrollY;state.listFocus=id?'edit-'+id:'create';}state.editing=!!id;state.formReturn=origin;state.id=id;state.draft=clone(a||blankAssistant());state.initial=JSON.stringify(state.draft);state.view='form';state.step=0;state.errors={};state.searches={};renderForm();window.scrollTo(0,0);focusHeading();}
function listSummary(a){if(a.mode==='smart')return `<span>协作成员 ${a.members.length}</span><span class="subline">资源与工具由成员管理</span>`;const data=a.routing==='auto'?'自动选择数据':a.routing==='all'?'全部数据源':`数据源 ${a.sources.length}${a.dirs.length?' · 目录 '+a.dirs.length:''}`;const tools=[`Skill ${enabled(a.skills).length}`,`MCP ${enabled(a.mcps).length}`,`插件 ${enabled(a.plugins).length}`];return `<span>${escapeHtml(data)}</span><span class="subline">${tools.join(' · ')}</span>`;}
function renderList(){$('root').classList.remove('resource-view');setActiveNav('assistants');const active=rows.filter(a=>a.status==='active').length;const smart=rows.filter(a=>a.status==='active'&&a.mode==='smart').length;const publicCount=rows.filter(a=>a.status==='active'&&a.visibility==='public').length;$('root').innerHTML=`<div class="breadcrumb"><span>工作区</span>${icon('chevron')}<span>助手管理</span></div><div class="page-head"><div><div class="head-title"><h1 id="page-title" tabindex="-1">助手管理</h1><span class="count-label">${rows.length}</span></div><p class="page-description">把资源、工具与访问授权，配置成可复用的助手。</p></div><div class="actions">${button('refresh',icon('refresh')+'刷新','', 'id="refresh"')}${button('create',icon('plus')+'新建助手','primary','data-focus="create"')}</div></div><div class="state-strip"><span class="od-row"><span class="dot good"></span>已启用 <strong>${active}</strong></span><span>普通助手 <strong>${active-smart}</strong></span><span>智能协作 <strong>${smart}</strong></span><span>公开助手 <strong>${publicCount}</strong></span></div><div class="panel list-panel"><div class="list-top"><div class="segment" aria-label="助手生命周期">${button('active','已启用 <small>'+active+'</small>','',`aria-pressed="${!state.archived}"`)}${button('archived','已归档 <small>'+(rows.length-active)+'</small>','',`aria-pressed="${state.archived}"`)}</div></div><div class="toolbar"><div class="filter search-filter"><label for="list-search">搜索助手</label><div class="input-wrap">${icon('search')}<input id="list-search" type="search" placeholder="搜索名称、标识或描述" value="${escapeHtml(state.query)}" autocomplete="off"></div></div><div class="filter"><label for="list-type">助手类型</label><select id="list-type">${options([['','全部类型'],...Object.entries(TYPE)],state.type)}</select></div><div class="filter"><label for="list-visibility">可见范围</label><select id="list-visibility">${options([['','全部范围'],['private','私有'],['public','公开']],state.visibility)}</select></div>${button('clear-filters','重置筛选','quiet')}</div><div id="table-area" class="table-wrap"></div><div id="pagination" class="pagination"></div></div><p class="page-note">${icon('info')}列表显示配置摘要，点击助手名称查看完整数据与授权范围。</p>`;renderTable();markNav();}
function filteredRows(){const q=state.query.trim().toLowerCase();return rows.filter(a=>a.status===(state.archived?'archived':'active')&&(!state.type||typeOf(a)===state.type)&&(!state.visibility||a.visibility===state.visibility)&&(!q||[a.name,a.slug,a.description].join(' ').toLowerCase().includes(q)));}
function renderTable(){const all=filteredRows(),totalPages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,totalPages);const start=(state.page-1)*state.size;const shown=all.slice(start,start+state.size);$('table-area').innerHTML=`<table aria-label="助手列表"><thead><tr>${['助手','类型','数据与工具','可见范围','状态','操作'].map(h=>'<th scope="col">'+h+'</th>').join('')}</tr></thead><tbody>${shown.length?shown.map(a=>`<tr><td><div class="name-cell"><span class="assistant-glyph ${a.mode==='smart'?'smart':''}">${icon(a.mode==='smart'?'team':'assistant')}</span><div class="od-field od-fill"><a class="name-link od-truncate" href="#assistant-${escapeHtml(a.id)}" data-action="detail" data-id="${escapeHtml(a.id)}" data-focus="name-${escapeHtml(a.id)}">${escapeHtml(a.name)}</a><span class="mono od-truncate">${escapeHtml(a.slug)}</span></div></div></td><td data-label="类型"><span class="kind-label">${TYPE[typeOf(a)]||'普通助手'}</span><span class="subline">${a.mode==='smart'?'协同执行':'独立执行'}</span></td><td data-label="数据与工具"><div class="binding-summary">${listSummary(a)}</div></td><td data-label="可见范围"><span class="access">${icon(a.visibility==='private'?'lock':'globe')}${a.visibility==='private'?'私有':'公开'}</span></td><td>${status(a)}</td><td><div class="table-actions">${a.status==='active'?button('edit','编辑','',`data-id="${a.id}" data-focus="edit-${a.id}"`)+button('archive',icon('archive'),'icon-only',`data-id="${a.id}" aria-label="归档 ${escapeHtml(a.name)}"`):button('restore',icon('refresh')+'恢复','',`data-id="${a.id}"`)}</div></td></tr>`).join(''):`<tr><td colspan="6" class="empty-cell"><div class="empty">${icon(state.archived?'archive':'search')}<h2>${state.archived&&!state.query&&!state.type&&!state.visibility?'还没有归档的助手':'没有匹配的助手'}</h2><p>${state.archived?'归档后配置会保留，您可以随时查看或恢复。':'尝试调整筛选条件，或创建一个新的助手。'}</p>${button('clear-filters','重置筛选')}${!state.archived?button('create','新建助手','primary'):''}</div></td></tr>`}</tbody></table>`;$('pagination').innerHTML=`<span role="status">${all.length?'第 '+(start+1)+'–'+Math.min(start+state.size,all.length)+' 项':'0 项'}，共 ${all.length} 个助手</span><div class="page-controls"><label for="page-size">每页</label><select id="page-size">${options([[5,'5'],[10,'10'],[20,'20']],state.size)}</select>${button('prev-page',icon('back'),'icon-only',`aria-label="上一页" ${state.page===1?'disabled':''}`)}<span class="od-nowrap">${state.page} / ${totalPages}</span>${button('next-page',icon('chevron'),'icon-only',`aria-label="下一页" ${state.page>=totalPages?'disabled':''}`)}</div>`;}
function options(pairs,current){return pairs.map(([value,label])=>`<option value="${escapeHtml(value)}"${String(value)===String(current)?' selected':''}>${escapeHtml(label)}</option>`).join('');}
function field(key,label,{type='text',hint='',choices=null,full=false,rows:lineCount=4,attrs=''}={}){const d=state.draft,val=key==='dirsText'?d.dirs.join('\n'):d[key]??'';const id='f-'+key,error=state.errors[key];const inputAttrs=`id="${id}" data-field="${key}" aria-describedby="${id}-error${hint?' '+id+'-hint':''}" ${error?'aria-invalid="true"':''} ${attrs}`;let control;if(choices)control=`<select ${inputAttrs}>${options(choices,val)}</select>`;else if(type==='textarea')control=`<textarea ${inputAttrs} rows="${lineCount}">${escapeHtml(val)}</textarea>`;else control=`<input type="${type}" ${inputAttrs} value="${escapeHtml(val)}">`;return `<div class="field-group${full?' full':''}"><label class="field-label" for="${id}">${label}</label>${control}${hint?`<span class="hint" id="${id}-hint">${hint}</span>`:''}<p class="error" id="${id}-error">${escapeHtml(error||'')}</p></div>`;}
function radioChoices(key,list){return `<div class="choices">${list.map(([value,title,note])=>`<label class="choice"><input type="radio" name="${key}" data-field="${key}" value="${value}"${checked(state.draft[key]===value)}><span class="od-field"><strong>${title}</strong><small>${note}</small></span></label>`).join('')}</div>`;}
const stepTitles=['基本信息','执行与数据','上下文与工具','访问授权'];
const stepNotes=['名称、模型与模式','资源或协作成员','上下文及绑定能力','可见范围与访问者'];
function renderForm(){$('root').classList.remove('resource-view');const d=state.draft;const title=state.editing?'编辑助手':'新建助手';$('root').innerHTML=`<div class="breadcrumb"><a href="#assistants" data-action="cancel-form">助手管理</a>${icon('chevron')}<span>${title}</span></div><div class="page-head"><div><h1 id="page-title" tabindex="-1">${title}</h1><p class="page-description">${state.editing?escapeHtml(d.name)+' · 按配置分组直接修改':'从一个明确的任务开始，为助手配置执行方式与访问边界。'}</p></div><div class="actions">${button('cancel-form','取消')}${state.editing?button('save','保存修改','primary','data-save'):''}</div></div><div class="form-layout"><aside><nav class="form-nav" aria-label="配置步骤">${stepTitles.map((t,i)=>`<button type="button" data-action="step" data-step="${i}" class="${state.step===i?'active':''}" ${state.step===i?'aria-current="step"':''}><span class="step-number">${i<state.step&&!state.editing?icon('check'):String(i+1).padStart(2,'0')}</span><span class="od-field"><span class="step-title">${t}</span><span class="step-note">${stepNotes[i]}</span></span></button>`).join('')}</nav><div class="form-side-note">${state.editing?'分组切换会保留当前输入。点击保存后统一更新配置。':'每一步的输入会保留，返回上一步可继续修改。'}</div><div class="form-summary" id="form-summary"></div></aside><form id="assistant-form" class="panel form-panel" novalidate><div class="section-heading"><div><h2>${stepTitles[state.step]}</h2><p>${['为助手设置身份、运行模式和使用的模型。',d.mode==='smart'?'选择参与协作的普通助手。':'选择助手能力与可使用的数据。',d.mode==='smart'?'设定协作上下文，具体工具由成员提供。':'定义工作上下文，绑定需要的技能与工具。','明确谁可以发现和使用这个助手。'][state.step]}</p></div><span class="section-counter">${String(state.step+1).padStart(2,'0')} / 04</span></div><div id="error-summary"></div><div id="fields" class="form-grid">${[basicFields,executionFields,toolsFields,accessFields][state.step]()}</div><div class="form-footer"><p class="hint">${state.editing?'修改仅在保存后生效。':'带 * 的字段为必填项。'}</p><div class="actions">${state.step>0?button('prev-step',icon('back')+'上一步'):''}${state.editing||state.step===3?button('save',state.editing?'保存修改':'创建助手','primary','data-save'):button('next-step','下一步'+icon('chevron'),'primary')}</div></div></form></div>`;updateFormSummary();paintErrors();markNav();}
function updateFormSummary(){if(!$('form-summary'))return;const a=state.draft;$('form-summary').innerHTML=`<div class="summary-line"><span>运行模式</span><strong>${a.mode==='smart'?'智能协作':'普通助手'}</strong></div><div class="summary-line"><span>主模型</span><strong>${escapeHtml(prettyModel(a.model))}</strong></div><div class="summary-line"><span>可见范围</span><strong>${a.visibility==='private'?'私有':'公开'}</strong></div>`;}
function basicFields(){const a=state.draft;return field('name','助手名称 <span class="required">*</span>',{attrs:'required maxlength="100"',hint:'用名称说明任务，例如“代码巡检助手”。'})+field('slug','唯一标识 <span class="required">*</span>',{attrs:'required maxlength="180" pattern="[-a-zA-Z0-9_]+"',hint:'用于访问标识。仅支持字母、数字、连字符和下划线。'})+field('description','描述',{type:'textarea',full:true,hint:'说明助手负责什么；描述不会替代执行上下文。'})+`<div class="field-group full"><span class="field-label" id="mode-label">运行模式</span><div role="group" aria-labelledby="mode-label">${radioChoices('mode',[['direct','普通助手','独立使用数据、技能和工具完成任务。'],['smart','智能协作','由已有普通助手共同完成任务。']])}</div></div>`+field('model','主模型 <span class="required">*</span>',{choices:[['','请选择模型'],...MODEL.map(m=>[m.id,m.name])],attrs:'required',hint:'模型选项为本地示例配置，不发起模型调用。'})+field('rounds','思考档位',{choices:Object.entries(ROUND),hint:'默认均衡，在响应速度与分析深度之间取舍。'})+(a.mode==='direct'?field('visionModel','多模态模型',{choices:[['','不使用'],...MODEL.filter(m=>m.vision).map(m=>[m.id,m.name])],hint:'仅列出支持视觉输入的示例模型。'}):'')+(state.editing?field('concurrency','最大并发数',{type:'number',attrs:'min="1" max="50" step="1"',hint:'允许 1–50；新建默认值为 5。'}):'');}
function searchBox(key,label,placeholder){return `<div class="field-group full"><label class="field-label" for="search-${key}">${label}</label><div class="input-wrap">${icon('search')}<input type="search" id="search-${key}" data-search="${key}" placeholder="${placeholder}" value="${escapeHtml(state.searches[key]||'')}"></div></div>`;}

function executionFields(){const a=state.draft;if(a.mode==='smart'){const candidates=rows.filter(r=>r.status==='active'&&r.mode==='direct'&&r.id!==a.id);return `<div class="field-group full"><div class="compact-note">${icon('team')}<p>成员提供各自配置的数据与工具。这里只选择普通助手，不重复配置资源。</p></div></div>`+searchBox('members','协作成员 *','搜索普通助手')+`<div class="field-group full" id="f-members" tabindex="-1"><div class="selection-list">${candidates.filter(r=>matches(r,'members')).map(r=>`<label class="check-row"><input type="checkbox" data-member="${r.id}"${checked(a.members.includes(r.id))}><span class="od-field od-fill"><strong>${escapeHtml(r.name)}</strong><small>${TYPE[r.capability]} · ${escapeHtml(r.description)}</small></span></label>`).join('')||'<p class="empty hint">没有可选择的普通助手，请先创建并启用普通助手。</p>'}</div><p class="error" id="f-members-error">${escapeHtml(state.errors.members||'')}</p></div>`;}

function toolPicker(kind,catalog,title){const a=state.draft;return `<div class="field-group full" id="f-${kind}" tabindex="-1"><div class="group-header"><h3>${title}</h3><span class="hint">已选 ${a[kind].length}</span></div>${kind==='skills'?`<label class="field-label" for="search-skills">搜索 Skill</label><input id="search-skills" type="search" data-search="skills" value="${escapeHtml(state.searches.skills||'')}" placeholder="搜索技能名称">`:''}<div class="selection-list">${catalog.filter(item=>matches(item,kind)).map(item=>{const b=a[kind].find(x=>x.id===item.id);return `<div class="selection-item"><label class="check-row"><input type="checkbox" data-binding="${kind}" value="${item.id}"${checked(!!b)}><span class="od-field od-fill"><strong>${item.name}</strong><small>${item.description}</small></span></label>${b?`<div class="nested-fields"><label class="check-row"><input type="checkbox" data-enabled="${kind}" value="${item.id}"${checked(b.enabled!==false)}><span class="hint">启用此绑定</span></label>${item.vars.length?`<div class="field-group"><label class="field-label" for="env-${kind}-${item.id}">环境变量集${item.vars.some(v=>v.required)?' *':''}</label><select id="env-${kind}-${item.id}" data-env="${kind}" data-id="${item.id}">${options([['','填写变量'],...ENVIRONMENTS.map(e=>[e.id,e.name+'（示例）'])],b.envSet||'')}</select><span class="hint">${b.envSet?'使用已保存的示例环境配置。':'手动填写本地示例配置；不要输入真实凭证。'}</span></div>${!b.envSet?item.vars.map(v=>`<div class="field-group"><label class="field-label" for="var-${kind}-${item.id}-${v.key}">${v.label}${v.required?' *':''}</label><input id="var-${kind}-${item.id}-${v.key}" data-var="${kind}" data-id="${item.id}" data-key="${v.key}" value="${escapeHtml(b.vars?.[v.key]||'')}" placeholder="${v.key==='ENDPOINT'?'https://search.example.com':'product-docs'}"></div>`).join(''):''}`:''}</div>`:''}</div>`;}).join('')||'<p class="empty hint">没有匹配的选项，请调整搜索条件。</p>'}</div><p class="error" id="f-${kind}-error">${escapeHtml(state.errors[kind]||'')}</p></div>`;}

function validation(step){const d=state.draft,err={};if(step===0){if(!d.name.trim())err.name='请输入助手名称。';if(!/^[-a-zA-Z0-9_]{1,180}$/.test(d.slug.trim()))err.slug='请输入 1–180 个字母、数字、连字符或下划线。';else if(rows.some(a=>a.id!==d.id&&a.slug.toLowerCase()===d.slug.trim().toLowerCase()))err.slug='该标识已被使用，请选择其他标识。';if(!MODEL.some(m=>m.id===d.model))err.model='请选择一个主模型。';if(d.mode==='direct'&&d.visionModel&&!MODEL.some(m=>m.id===d.visionModel&&m.vision))err.visionModel='请选择支持视觉输入的模型。';if(state.editing&&(!Number.isInteger(Number(d.concurrency))||Number(d.concurrency)<1||Number(d.concurrency)>50))err.concurrency='并发数必须为 1–50 的整数。';}

function gotoStep(index){if(index<0||index>3||state.busy)return;if(!state.editing&&index>state.step){for(let s=0;s<index;s++){const errors=validation(s);if(Object.keys(errors).length){state.step=s;state.errors=errors;renderForm();$('error-summary')?.scrollIntoView({block:'start'});return;}}}state.step=index;state.errors={};renderForm();window.scrollTo(0,0);document.querySelector('.form-nav .active')?.focus({preventScroll:true});}

function renderDetail(){$('root').classList.remove('resource-view');const a=byId(state.id);if(!a){openList();return;}const smart=a.mode==='smart';$('root').innerHTML=`<div class="breadcrumb"><a href="#assistants" data-action="back-list">助手管理</a>${icon('chevron')}<span>助手详情</span></div><div class="page-head"><div class="detail-heading"><span class="assistant-glyph ${smart?'smart':''}">${icon(smart?'team':'assistant')}</span><div><div class="head-title"><h1 id="page-title" tabindex="-1">${escapeHtml(a.name)}</h1>${status(a)}</div><p class="page-description"><span class="mono">${escapeHtml(a.slug)}</span> · ${TYPE[typeOf(a)]}</p></div></div><div class="actions">${button('back-list',icon('back')+'返回列表')}${a.status==='active'?button('edit',icon('edit')+'编辑助手','primary',`data-id="${a.id}"`):button('restore','恢复助手','primary',`data-id="${a.id}"`)}</div></div><nav class="detail-tabs" aria-label="详情分组">${['概览','数据访问','绑定能力','访问授权'].map((title,i)=>`<button type="button" data-action="detail-tab" data-tab="${i}" class="${state.detailTab===i?'active':''}" ${state.detailTab===i?'aria-current="page"':''}>${title}</button>`).join('')}</nav><div class="detail-layout"><div class="detail-body">${detailBody(a)}</div><aside><div class="panel detail-side"><h3>配置摘要</h3><dl><div><dt>运行模式</dt><dd>${smart?'智能协作':'普通助手'}</dd></div><div><dt>${smart?'协作成员':'数据模式'}</dt><dd>${smart?a.members.length+' 位':ROUTING[a.routing]}</dd></div>${!smart?`<div><dt>启用的 Skill</dt><dd>${enabled(a.skills).length}</dd></div><div><dt>启用的 MCP</dt><dd>${enabled(a.mcps).length}</dd></div><div><dt>启用的插件</dt><dd>${enabled(a.plugins).length}</dd></div>`:''}<div><dt>访问范围</dt><dd>${a.visibility==='private'?'私有':'公开'}</dd></div></dl></div>${a.status==='archived'?'<p class="page-note">归档配置保留，恢复后可继续编辑。</p>':''}</aside></div>`;markNav();}
function syncField(el){const key=el.dataset.field;if(!key)return;let value=el.type==='checkbox'?el.checked:el.value;if(key==='dirsText')state.draft.dirs=relativeDirs(value);else if(key==='concurrency')value=Math.max(1,Math.min(50,Number(value)||1));state.draft[key]=value;state.errors[key]='';if(key==='mode'){if(value==='smart'){state.draft.capability='general_chat';state.draft.routing='auto';state.draft.sources=[];state.draft.skills=[];state.draft.mcps=[];state.draft.plugins=[];}else if(state.draft.mode==='direct'&&state.draft.capability==='')state.draft.capability='general_chat';}if(key==='capability'&&value==='general_chat'){state.draft.dirs=[];}updateFormSummary();}
function syncBinding(kind,id,checkedValue){const arr=state.draft[kind],idx=arr.findIndex(b=>b.id===id);if(checkedValue&&idx<0)arr.push(binding(id));if(!checkedValue&&idx>=0)arr.splice(idx,1);state.errors[kind]='';}
function wireEvents(){document.body.onclick=async(e)=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='list-nav'){if(state.view==='form'&&!await leaveForm())return;openList(true);return;}if(action==='resources-nav'){openResources();return;}if(action==='open-resource-file'){openResources('resources');return;}if(action==='open-connection-file'){openResources('connections');return;}if(action==='resource-tab'){openResources(target.dataset.tab);return;}if(action==='resource-refresh'){toast('资源列表已刷新。');return;}if(action==='connection-add'||action==='connection-detail'||action==='resource-detail'){toast('该原型已保留入口，详情将在当前工作区展开。');return;}if(action==='create'){openForm();return;}if(action==='refresh'){toast('列表已刷新（本地示例数据）。');renderList();return;}if(action==='active'||action==='archived'){state.archived=action==='archived';state.page=1;renderList();return;}if(action==='clear-filters'){state.query='';state.type='';state.visibility='';state.page=1;renderList();return;}if(action==='detail'||action==='member-detail'){e.preventDefault();openDetail(target.dataset.id);return;}if(action==='edit'){if(state.view==='detail'&&state.id===target.dataset.id){openForm(target.dataset.id,'detail');}else openForm(target.dataset.id,'list');return;}if(action==='archive'){const a=byId(target.dataset.id);if(a&&await confirmAction('归档助手？',`“${a.name}”将从已启用列表移除，配置会保留。`, '归档',true)){a.status='archived';persist();toast('助手已归档。');renderList();}return;}if(action==='restore'){const a=byId(target.dataset.id);if(a){a.status='active';persist();toast('助手已恢复。');if(state.view==='detail')renderDetail();else renderList();}return;}if(action==='back-list'||action==='cancel-form'){if(action==='cancel-form'&&!await leaveForm())return;openList(true);return;}if(action==='step'){gotoStep(Number(target.dataset.step));return;}if(action==='prev-step'){gotoStep(state.step-1);return;}if(action==='next-step'){gotoStep(state.step+1);return;}if(action==='save'){save();return;}if(action==='detail-tab'){state.detailTab=Number(target.dataset.tab);renderDetail();return;}if(action==='prev-page'){if(state.page>1){state.page--;renderTable();}return;}if(action==='next-page'){const total=Math.max(1,Math.ceil(filteredRows().length/state.size));if(state.page<total){state.page++;renderTable();}return;}if(action==='error-focus'){$('f-'+target.dataset.key)?.focus();return;}};
document.body.oninput=(e)=>{const el=e.target;if(el.matches('[data-field]')){syncField(el);if(state.view==='form'&&state.editing===false&&state.step===0){const err=validation(0);state.errors={...state.errors,...err};paintErrors();}return;}if(el.matches('[data-search]')){state.searches[el.dataset.search]=el.value;preserveInputRender();return;}if(el.id==='list-search'){state.query=el.value;renderTable();requestAnimationFrame(()=>{$('list-search')?.focus();});}};
document.body.onchange=(e)=>{const el=e.target;if(el.matches('[data-field]')){syncField(el);if(state.view==='form'&&state.step===0)paintErrors();return;}if(el.id==='list-type'){state.type=el.value;state.page=1;renderTable();return;}if(el.id==='list-visibility'){state.visibility=el.value;state.page=1;renderTable();return;}if(el.id==='page-size'){state.size=Number(el.value);state.page=1;renderTable();return;}if(el.matches('[data-member]')){syncBinding('members',el.dataset.member,el.checked);preserveInputRender();return;}if(el.matches('[data-source]')){const id=el.dataset.source;if(el.checked)state.draft.sources.push({id,items:null});else state.draft.sources=state.draft.sources.filter(b=>b.id!==id);preserveInputRender();return;}if(el.matches('[data-allitems]')){const b=state.draft.sources.find(x=>x.id===el.dataset.allitems);if(b)b.items=el.checked?null:[];preserveInputRender();return;}if(el.matches('[data-sourceitem]')){const b=state.draft.sources.find(x=>x.id===el.dataset.sourceitem);if(b&&b.items!==null){if(el.checked&&!b.items.includes(el.value))b.items.push(el.value);if(!el.checked)b.items=b.items.filter(i=>i!==el.value);}preserveInputRender();return;}if(el.matches('[data-binding]')){syncBinding(el.dataset.binding,el.value,el.checked);preserveInputRender();return;}if(el.matches('[data-enabled]')){const b=state.draft[el.dataset.enabled].find(x=>x.id===el.value);if(b)b.enabled=el.checked;state.errors[el.dataset.enabled]='';preserveInputRender();return;}if(el.matches('[data-env]')){const b=state.draft[el.dataset.env].find(x=>x.id===el.dataset.id);if(b){b.envSet=el.value;b.vars={};}preserveInputRender();return;}if(el.matches('[data-var]')){const b=state.draft[el.dataset.var].find(x=>x.id===el.dataset.id);if(b){b.vars=b.vars||{};b.vars[el.dataset.key]=el.value;}state.errors[el.dataset.var]='';return;}if(el.matches('[data-access]')){const key=el.dataset.access;if(el.checked&&!state.draft[key].includes(el.value))state.draft[key].push(el.value);if(!el.checked)state.draft[key]=state.draft[key].filter(i=>i!==el.value);preserveInputRender();return;}};
}
function start(){const root=$('root');if(!root)return;wireEvents();if(location.hash==='#connections'||location.hash==='#resources'){openResources(location.hash.slice(1));}else if(location.hash.startsWith('#assistant-'))openDetail(location.hash.slice(11));else renderList();}
start();
</script></body></html>
