# Distinct compose project name so the dev stack is fully isolated from the
# production stacks (docker-compose.yml / docker-compose.standalone.yml, which
# use project "sourcelens"). Without this all three would default to the
# directory name and share a project namespace + the postgresql/redis service
# keys, so bringing up a production stack in this directory would recreate the
# dev containers (and vice versa).
name: sourcelens-dev

services:
  backend-api:
    image: sourcelens-api:latest
    container_name: sourcelens-api-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      LENSNODE_NAME: ${LENSNODE_NAME:-local-dev-lensnode}
      LENSNODE_WORKSPACE_PATH: /workspace
      # Development login must not depend on the external Turnstile service.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        DEV_MODE: "1"
        APT_MIRROR_URL: ${APT_MIRROR_URL:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    volumes:
      - ./data.dev/django/staticfiles:/opt/backend/core/staticfiles
      - ./data.dev/logs/api:/var/log/gunicorn
      - ./backend:/opt/backend
      - ./docker/nginx/certs:/opt/certs
      - ./data.dev/storage:/opt/storage
      - ./data.dev/document-attachments:/opt/document-attachments
      - ./data.dev/deliverables:/opt/deliverables
    networks:
      - backend_network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend-worker:
    image: sourcelens-api:latest
    container_name: sourcelens-worker-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      WORKSPACE_ROOT: /opt/backend
      # Development login must not depend on the external Turnstile service.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
    volumes:
      - ./data.dev/logs/worker:/var/log/celery
      - ./data.dev/storage:/opt/storage
      - ./data.dev/document-attachments:/opt/document-attachments
      - ./data.dev/deliverables:/opt/deliverables
      - ./backend:/opt/backend
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery

  backend-scheduler:
    image: sourcelens-api:latest
    container_name: sourcelens-scheduler-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      # Development login must not depend on the external Turnstile service.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
    volumes:
      - ./data.dev/logs/scheduler:/var/log/celery
      - ./backend:/opt/backend
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery-beat

  postgresql:
    image: postgres:17
    container_name: sourcelens-postgres-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      # Allow password authentication from any host (safe in Docker network)
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ./docker/postgresql/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./docker/postgresql/etc/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./data.dev/postgresql/data:/var/lib/postgresql/data
      - ./data.dev/logs/postgresql:/var/log/postgresql
    entrypoint: ["bash", "-c", "mkdir -p /var/log/postgresql && chown -R postgres:postgres /var/log/postgresql && chmod -R 755 /var/log/postgresql && exec docker-entrypoint.sh \"$$@\""]
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: sourcelens-redis-dev
    restart: unless-stopped
    command: redis-server
    volumes:
      - ./data.dev/redis:/data
      - ./data.dev/logs/redis:/var/log/redis
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flower:
    image: sourcelens-api:latest
    container_name: sourcelens-flower-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"
    depends_on:
      backend-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: flower
    networks:
      - backend_network

  lensnode:
    build:
      context: ./lensnode
      dockerfile: Dockerfile
      args:
        APT_MIRROR_URL: ${APT_MIRROR_URL:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    image: sourcelens-lensnode:latest
    container_name: sourcelens-lensnode-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      LENSNODE_NAME: ${LENSNODE_NAME:-local-dev-lensnode}
      LENSNODE_CONTROL_WS_URL: ws://backend-api:8000/ws/lens/lensnodes/
      LENSNODE_AI_GATEWAY_URL: http://backend-api:8000/api/lens/lensnode/ai-gateway/
      LENSNODE_WORKSPACE_PATH: /workspace
      LENSNODE_HEARTBEAT_INTERVAL_S: 15
      LENSNODE_REQUEST_TIMEOUT_S: ${LENSNODE_REQUEST_TIMEOUT_S:-600}
      LENSNODE_RUN_IDLE_TIMEOUT_S: ${LENSNODE_RUN_IDLE_TIMEOUT_S:-180}
      LENSNODE_PLANNING_REASONING_EFFORT: ${LENSNODE_PLANNING_REASONING_EFFORT:-medium}
      LENSNODE_MCP_DISCOVERY_TIMEOUT_S: ${LENSNODE_MCP_DISCOVERY_TIMEOUT_S:-30}
      LENSNODE_MCP_TOOL_TIMEOUT_S: ${LENSNODE_MCP_TOOL_TIMEOUT_S:-60}
      LENSNODE_MCP_DEFER_THRESHOLD: ${LENSNODE_MCP_DEFER_THRESHOLD:-12}
      # Max concurrent runs per node. Increase in production based on node resources.
      LENSNODE_MAX_CONCURRENT_RUNS: ${LENSNODE_MAX_CONCURRENT_RUNS:-8}
      LENSNODE_HEAVY_WORK_CONCURRENCY: ${LENSNODE_HEAVY_WORK_CONCURRENCY:-1}
      LENSNODE_MEMORY_LIMIT_MB: ${LENSNODE_MEMORY_LIMIT_MB:-}
      LENSNODE_NODE_MAX_OLD_SPACE_MB: ${LENSNODE_NODE_MAX_OLD_SPACE_MB:-}
      LENSNODE_NODE_OPTIONS: ${LENSNODE_NODE_OPTIONS:-}
      # Proactive file-offload thresholds (issue #60). Tool default 5000:
      # large workspace reads are evicted to re-readable files so heavy-
      # retrieval runs stop thrashing the summarizer. Human unset = library
      # default 50000 (pasted subject stays inline, protected by the anchor
      # exemption). Override here only for experiments.
      LENSNODE_OFFLOAD_TOOL_TOKENS: ${LENSNODE_OFFLOAD_TOOL_TOKENS:-}
      LENSNODE_OFFLOAD_HUMAN_TOKENS: ${LENSNODE_OFFLOAD_HUMAN_TOKENS:-}
      PYTHONPATH: /opt/lensnode
    volumes:
      - ./data.dev/workspace:/workspace
      - ./lensnode/lensnode:/opt/lensnode/lensnode:ro
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: sourcelens-ui:latest
    container_name: sourcelens-ui-dev
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      # Keep the development login flow aligned with the backend bypass.
      VITE_TURNSTILE_SITE_KEY: ""
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/design:/app/design:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/package-lock.json:/app/package-lock.json:ro
      - ./frontend/node_modules:/app/node_modules
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: sourcelens-nginx-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
      - ./data.dev/django/staticfiles:/staticfiles:ro
      - ./data.dev/logs/nginx:/var/log/nginx
      - ./data.dev/storage:/opt/storage:ro
    ports:
      - "${DJANGO_HOST_PORT:-8000}:80"
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend_network:
    driver: bridge
