# Distinct compose project name so the dev stack is fully isolated from the
# production stacks (docker-compose.yml / docker-compose.standalone.yml, which
# use project "sourcelens"). Without this all three would default to the
# directory name and share a project namespace + the postgresql/redis service
# keys, so bringing up a production stack in this directory would recreate the
# dev containers (and vice versa).
# WORKTREE_DIR switches source mounts only; relative paths are resolved from
# this Compose directory. Recreate containers when switching worktrees: restart
# keeps the original mounts. Build contexts stay here; rebuild dependencies here
# when the target worktree requires different packages.
# devctl also uses this file, selecting infrastructure or applications explicitly.
# DEV_* overrides preserve existing stack settings; unset values retain the standalone defaults.
name: sourcelens-dev

services:
  backend-api:
    image: ${DEV_BACKEND_IMAGE:-sourcelens-api:latest}
    entrypoint: ["${DEV_BACKEND_ENTRYPOINT:-/entrypoint.sh}"]
    container_name: ${DEV_API_CONTAINER:-sourcelens-api-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: &dev-env
      - ${DEV_CONFIG:-./.env.dev}
      # Managed overrides contain only local endpoints/identities, never credentials.
      - ${DEV_OVERRIDE_CONFIG:-${DEV_CONFIG:-./.env.dev}}
    environment:
      LENS_PLUGIN_ROOTS: /opt/plugins
      LENSNODE_NAME: ${LENSNODE_NAME:-local-dev-lensnode}
      LENSNODE_TOKEN: ${LENSNODE_TOKEN:-dev-lensnode-token}
      LENSNODE_WORKSPACE_PATH: /workspace
      # Development login must not depend on the external Turnstile service.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
    build:
      context: ${DEV_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
      target: backend
      args:
        DEV_MODE: "1"
        APT_MIRROR_URL: ${APT_MIRROR_URL:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    volumes:
      # Share runtime data across worktrees; switching branches must not replace stored data.
      - ${DEV_STATICFILES_DIR:-./data.dev/django/staticfiles}:/opt/backend/core/staticfiles
      - ${DEV_DATA_DIR:-./data.dev}/logs/api:/var/log/gunicorn
      - ${DEV_WORKTREE_ENTRYPOINT:-${DEV_ROOT:-.}/docker/worktree-entrypoint.sh}:/worktree-entrypoint.sh:ro
      - ${WORKTREE_DIR:-.}/backend:/opt/backend
      - ${WORKTREE_DIR:-.}/plugins:/opt/plugins:ro
      # Certificates stay with shared configuration, independent of the selected branch.
      - ${DEV_ROOT:-.}/docker/nginx/certs:/opt/certs
      - ${DEV_DATA_DIR:-./data.dev}/storage:/opt/storage
      - ${DEV_DATA_DIR:-./data.dev}/workspace:/workspace
      - ${DEV_DATA_DIR:-./data.dev}/document-attachments:/opt/document-attachments
      - ${DEV_DATA_DIR:-./data.dev}/deliverables:/opt/deliverables
    networks:
      - backend_network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend-worker:
    image: ${DEV_BACKEND_IMAGE:-sourcelens-api:latest}
    entrypoint: ["${DEV_BACKEND_ENTRYPOINT:-/entrypoint.sh}"]
    container_name: ${DEV_WORKER_CONTAINER:-sourcelens-worker-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    environment:
      LENS_PLUGIN_ROOTS: /opt/plugins
      WORKSPACE_ROOT: /opt/backend
      LENSNODE_TOKEN: ${LENSNODE_TOKEN:-dev-lensnode-token}
      LENSNODE_AI_GATEWAY_URL: >-
        http://backend-api:8000/api/lens/lensnode/ai-gateway/
      # Development login must not depend on the external Turnstile service.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
    volumes:
      # Share runtime data across worktrees; switching branches must not replace stored data.
      - ${DEV_DATA_DIR:-./data.dev}/logs/worker:/var/log/celery
      - ${DEV_DATA_DIR:-./data.dev}/storage:/opt/storage
      - ${DEV_DATA_DIR:-./data.dev}/workspace:/workspace
      - ${DEV_DATA_DIR:-./data.dev}/document-attachments:/opt/document-attachments
      - ${DEV_DATA_DIR:-./data.dev}/deliverables:/opt/deliverables
      - ${DEV_WORKTREE_ENTRYPOINT:-${DEV_ROOT:-.}/docker/worktree-entrypoint.sh}:/worktree-entrypoint.sh:ro
      - ${WORKTREE_DIR:-.}/backend:/opt/backend
      - ${WORKTREE_DIR:-.}/plugins:/opt/plugins:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery

  backend-scheduler:
    image: ${DEV_BACKEND_IMAGE:-sourcelens-api:latest}
    entrypoint: ["${DEV_BACKEND_ENTRYPOINT:-/entrypoint.sh}"]
    container_name: ${DEV_SCHEDULER_CONTAINER:-sourcelens-scheduler-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    environment:
      LENS_PLUGIN_ROOTS: /opt/plugins
      # Development login must not depend on the external Turnstile service.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
    volumes:
      # Share runtime data across worktrees; switching branches must not replace stored data.
      - ${DEV_DATA_DIR:-./data.dev}/logs/scheduler:/var/log/celery
      - ${DEV_WORKTREE_ENTRYPOINT:-${DEV_ROOT:-.}/docker/worktree-entrypoint.sh}:/worktree-entrypoint.sh:ro
      - ${WORKTREE_DIR:-.}/backend:/opt/backend
      - ${WORKTREE_DIR:-.}/plugins:/opt/plugins:ro
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery-beat

  postgresql:
    image: postgres:17
    container_name: ${DEV_POSTGRES_CONTAINER:-sourcelens-postgres-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      # Allow password authentication from any host (safe in Docker network)
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      # Database setup stays shared; branch migrations still affect this single database.
      - ${DEV_ROOT:-.}/docker/postgresql/initdb.d:/docker-entrypoint-initdb.d:ro
      - ${DEV_ROOT:-.}/docker/postgresql/etc/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Keep the same database when switching source; older branches may lack applied migrations.
      - ${DEV_POSTGRES_DATA:-./data.dev/postgresql/data}:/var/lib/postgresql/data
      - ${DEV_DATA_DIR:-./data.dev}/logs/postgresql:/var/log/postgresql
    entrypoint: ["bash", "-c", "mkdir -p /var/log/postgresql && chown -R postgres:postgres /var/log/postgresql && chmod -R 755 /var/log/postgresql && exec docker-entrypoint.sh \"$$@\""]
    ports:
      - "${DEV_POSTGRES_BIND:-5432}:5432"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: ${DEV_REDIS_IMAGE:-redis:alpine}
    container_name: ${DEV_REDIS_CONTAINER:-sourcelens-redis-dev}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "", "--appendonly", "${DEV_REDIS_APPENDONLY:-no}", "--databases", "${DEV_REDIS_DATABASES:-16}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flower:
    image: ${DEV_BACKEND_IMAGE:-sourcelens-api:latest}
    entrypoint: ["${DEV_BACKEND_ENTRYPOINT:-/entrypoint.sh}"]
    container_name: ${DEV_FLOWER_CONTAINER:-sourcelens-flower-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    ports:
      - "${DEV_FLOWER_BIND:-${FLOWER_HOST_PORT:-5555}}:5555"
    depends_on:
      backend-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${DEV_WORKTREE_ENTRYPOINT:-${DEV_ROOT:-.}/docker/worktree-entrypoint.sh}:/worktree-entrypoint.sh:ro
      - ${WORKTREE_DIR:-.}/backend:/opt/backend
      - ${WORKTREE_DIR:-.}/plugins:/opt/plugins:ro
    command: flower
    networks:
      - backend_network

  lensnode:
    build:
      context: ${DEV_BUILD_CONTEXT:-.}
      dockerfile: lensnode/Dockerfile
      args:
        APT_MIRROR_URL: ${APT_MIRROR_URL:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    image: ${DEV_LENSNODE_IMAGE:-sourcelens-lensnode:latest}
    container_name: ${DEV_LENSNODE_CONTAINER:-sourcelens-lensnode-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    environment:
      LENSNODE_NAME: ${LENSNODE_NAME:-local-dev-lensnode}
      LENSNODE_TOKEN: ${LENSNODE_TOKEN:-dev-lensnode-token}
      LENSNODE_AGENT_VERSION: ${APP_VERSION:-dev}
      LENSNODE_CONTROL_WS_URL: ws://backend-api:8000/ws/lens/lensnodes/
      LENSNODE_AI_GATEWAY_URL: http://backend-api:8000/api/lens/lensnode/ai-gateway/
      LENSNODE_WORKSPACE_PATH: /workspace
      LENSNODE_CHECKPOINT_DIR: /runtime/checkpoints
      HTTP_PROXY: ${LENSNODE_HTTP_PROXY:-}
      HTTPS_PROXY: ${LENSNODE_HTTPS_PROXY:-}
      ALL_PROXY: ${LENSNODE_ALL_PROXY:-}
      NO_PROXY: ${LENSNODE_NO_PROXY:-}
      LENSNODE_EXECUTION_BACKEND: ${LENSNODE_EXECUTION_BACKEND:-trusted_container}
      LENSNODE_HEARTBEAT_INTERVAL_S: 15
      LENSNODE_REQUEST_TIMEOUT_S: ${LENSNODE_REQUEST_TIMEOUT_S:-600}
      LENSNODE_RUN_IDLE_TIMEOUT_S: ${LENSNODE_RUN_IDLE_TIMEOUT_S:-180}
      LENSNODE_STREAM_RECOVERY_ATTEMPTS: ${LENSNODE_STREAM_RECOVERY_ATTEMPTS:-3}
      LENSNODE_STREAM_RECOVERY_BACKOFF_S: ${LENSNODE_STREAM_RECOVERY_BACKOFF_S:-1}
      LENSNODE_STREAM_RECOVERY_BACKOFF_MAX_S: ${LENSNODE_STREAM_RECOVERY_BACKOFF_MAX_S:-8}
      LENSNODE_PLANNING_REASONING_EFFORT: ${LENSNODE_PLANNING_REASONING_EFFORT:-medium}
      LENSNODE_MCP_DISCOVERY_TIMEOUT_S: ${LENSNODE_MCP_DISCOVERY_TIMEOUT_S:-30}
      LENSNODE_MCP_TOOL_TIMEOUT_S: ${LENSNODE_MCP_TOOL_TIMEOUT_S:-60}
      LENSNODE_MCP_DEFER_THRESHOLD: ${LENSNODE_MCP_DEFER_THRESHOLD:-12}
      # Max concurrent runs per node. Increase in production based on node resources.
      LENSNODE_MAX_CONCURRENT_RUNS: ${LENSNODE_MAX_CONCURRENT_RUNS:-8}
      LENSNODE_MAX_CONCURRENT_DATASOURCE_SYNCS: ${LENSNODE_MAX_CONCURRENT_DATASOURCE_SYNCS:-1}
      LENSNODE_MEMORY_LIMIT_MB: ${LENSNODE_MEMORY_LIMIT_MB:-}
      LENSNODE_NODE_MAX_OLD_SPACE_MB: ${LENSNODE_NODE_MAX_OLD_SPACE_MB:-}
      LENSNODE_NODE_OPTIONS: ${LENSNODE_NODE_OPTIONS:-}
      # Proactive file-offload thresholds (issue #60). Tool default 5000:
      # large workspace reads are evicted to re-readable files so heavy-
      # retrieval runs stop thrashing the summarizer. Human unset = library
      # default 50000 (pasted subject stays inline, protected by the anchor
      # exemption). Override here only for experiments.
      LENSNODE_OFFLOAD_TOOL_TOKENS: ${LENSNODE_OFFLOAD_TOOL_TOKENS:-}
      LENSNODE_OFFLOAD_HUMAN_TOKENS: ${LENSNODE_OFFLOAD_HUMAN_TOKENS:-}
      PYTHONPATH: /opt/lensnode
    volumes:
      # Share runtime data across worktrees; switching branches must not replace stored data.
      - ${DEV_DATA_DIR:-./data.dev}/workspace:/workspace
      - ${DEV_DATA_DIR:-./data.dev}/runtime:/runtime
      - ${DEV_DATA_DIR:-./data.dev}/storage/media:/opt/storage/media:ro
      - ${WORKTREE_DIR:-.}/lensnode/lensnode:/opt/lensnode/lensnode:ro
      - ${WORKTREE_DIR:-.}/plugins:/opt/plugins:ro
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy

  frontend:
    build:
      context: ${DEV_FRONTEND_DIR:-./frontend}
      dockerfile: Dockerfile.dev
    image: ${DEV_FRONTEND_IMAGE:-sourcelens-ui:latest}
    working_dir: /app
    command: [sh, -c, "${DEV_FRONTEND_COMMAND:-exec npm run dev -- --host 0.0.0.0}"]
    container_name: ${DEV_FRONTEND_CONTAINER:-sourcelens-ui-dev}
    pull_policy: missing
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    environment:
      # Keep the development login flow aligned with the backend bypass.
      VITE_TURNSTILE_SITE_KEY: ""
      API_PROXY_TARGET: http://backend-api:8000
    volumes:
      - ${WORKTREE_DIR:-.}/frontend/src:/app/src:ro
      - ${WORKTREE_DIR:-.}/frontend/public:/app/public:ro
      - ${WORKTREE_DIR:-.}/frontend/design:/app/design:ro
      - ${WORKTREE_DIR:-.}/frontend/index.html:/app/index.html:ro
      # Keep dev-server configuration and dependency manifests with the installed dependencies.
      - ${DEV_FRONTEND_DIR:-./frontend}/vite.config.js:/app/vite.config.js:ro
      - ${DEV_FRONTEND_DIR:-./frontend}/tailwind.config.js:/app/tailwind.config.js:ro
      - ${DEV_FRONTEND_DIR:-./frontend}/postcss.config.js:/app/postcss.config.js:ro
      - ${DEV_FRONTEND_DIR:-./frontend}/package.json:/app/package.json:ro
      - ${DEV_FRONTEND_DIR:-./frontend}/package-lock.json:/app/package-lock.json:ro
      # Other worktrees may have no dependencies; an empty mount would break the dev server.
      - ${DEV_NODE_MODULES:-./frontend/node_modules}:/app/node_modules
      - npm-cache:/npm-cache
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy

    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  nginx:
    image: nginx:latest
    container_name: ${DEV_NGINX_CONTAINER:-sourcelens-nginx-dev}
    restart: unless-stopped
    # Keep one shared configuration home; switching branches must not switch credentials.
    env_file: *dev-env
    volumes:
      # Routing config stays shared so a source switch does not change the stack entry point.
      - ${DEV_ROOT:-.}/docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
      - ${DEV_STATICFILES_DIR:-./data.dev/django/staticfiles}:/staticfiles:ro
      - ${DEV_DATA_DIR:-./data.dev}/logs/nginx:/var/log/nginx
      - ${DEV_DATA_DIR:-./data.dev}/storage:/opt/storage:ro
    ports:
      - "${DEV_HTTP_BIND:-${DJANGO_HOST_PORT:-8000}}:80"
    networks:
      - backend_network
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "${DEV_NGINX_HEALTH_COMMAND:-nginx -t}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend_network:
    # Keep the existing development network when devctl recreates application services.
    name: ${DEV_NETWORK_NAME:-${COMPOSE_PROJECT_NAME}_backend_network}
    external: ${DEV_NETWORK_EXTERNAL:-false}

volumes:
  postgres-data:
    name: ${DEV_POSTGRES_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_postgres-data}
    external: ${DEV_SHARED_VOLUMES_EXTERNAL:-false}
  redis-data:
    name: ${DEV_REDIS_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_redis-data}
    external: ${DEV_SHARED_VOLUMES_EXTERNAL:-false}
  node-modules:
  npm-cache:
