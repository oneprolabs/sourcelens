[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lensnode"
version = "0.1.0"
description = "SourceLens LensNode execution worker"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents==0.7.15",
    "httpx[http2]>=0.28.0",
    "langchain>=1.4.1,<1.5.0",
    "langchain-anthropic>=1.7.2,<1.8.0",
    "langchain-core>=1.6.3,<1.7.0",
    "langchain-mcp-adapters>=0.2.2,<0.4.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.2",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "sentry-sdk>=1.40.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
lensnode = "lensnode.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lensnode*"]
