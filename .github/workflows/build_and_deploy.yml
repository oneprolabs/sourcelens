name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: false
        default: ''

concurrency:
  group: sourcelens-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
  SSH_HOST: ${{ vars.SOURCELENS_SSH_HOST }}
  SSH_USER: ${{ vars.SOURCELENS_SSH_USER }}
  SSH_PORT: ${{ vars.SOURCELENS_SSH_PORT }}
  DEPLOY_PATH: ${{ vars.SOURCELENS_DEPLOY_PATH }}

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_date: ${{ steps.release.outputs.release_date }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          # version = the image tag (v-stripped); ref = the git ref
          # scripts/install.sh fetches deploy assets from and derives the same
          # image tag out of (${ref#v}). For a tag push they line up exactly.
          # A manual dispatch is assumed to redeploy an existing release, so its
          # ref is the corresponding v<version> tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REF="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            REF="v${{ inputs.version }}"
          else
            # No tag, no manual version: build/deploy the pushed commit. Use the
            # FULL SHA for both — install.sh derives the image tag from the ref
            # it fetches (${ref#v}), so a 7-char VERSION with a 40-char REF would
            # tag images :<short> but make install.sh pull :<full> (a nonexistent
            # tag). raw.githubusercontent.com resolves a full SHA but not a short
            # one, so the full SHA is the value that works for both.
            VERSION="${GITHUB_SHA}"
            REF="${GITHUB_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.version.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release-note tooling dependency
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Generate deterministic release notes
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ steps.version.outputs.ref }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_date="$(
            git for-each-ref \
              --format='%(taggerdate:format:%Y/%m/%d)' \
              "refs/tags/${RELEASE_REF}"
          )"
          if [ -z "${release_date}" ]; then
            release_date="$(
              git show -s \
                --format='%cd' \
                --date='format:%Y/%m/%d' \
                "${RELEASE_REF}^{commit}"
            )"
          fi
          python scripts/release_notes.py build \
            --tag "${RELEASE_REF}" \
            --version "${RELEASE_VERSION}" \
            --release-date "${release_date}" \
            --manifest release-artifacts/release-notes.json \
            --body release-artifacts/release-notes.md
          echo "release_date=${release_date}" >> "$GITHUB_OUTPUT"

      - name: Upload release-note artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.version.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  build-images:
    runs-on: ubuntu-latest
    needs:
      - prepare-version
    strategy:
      matrix:
        include:
          - image_name: sourcelens-backend
            context: .
            file: ./Dockerfile
            target: backend
          - image_name: sourcelens-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: ''
          - image_name: sourcelens-lensnode
            context: .
            file: ./lensnode/Dockerfile
            target: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.ref }}

      - name: Download release-note artifacts
        if: ${{ matrix.image_name == 'sourcelens-frontend' }}
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.prepare-version.outputs.version }}
          path: release-artifacts

      - name: Embed and verify frontend release notes
        if: ${{ matrix.image_name == 'sourcelens-frontend' }}
        shell: bash
        env:
          RELEASE_DATE: ${{ needs.prepare-version.outputs.release_date }}
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          set -euo pipefail
          cp \
            release-artifacts/release-notes.json \
            frontend/src/generated/release-notes.json
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg release_date "${RELEASE_DATE}" \
            '.version == $version and .releaseDate == $release_date' \
            frontend/src/generated/release-notes.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # REGISTRY is the Docker Hub namespace (oneprolabs), used as the image
      # prefix below; the login host for Docker Hub is docker.io.
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ALIYUN_REGISTRY is the Aliyun ACR registry host, ALIYUN_NAMESPACE the
      # namespace under it (e.g. registry.cn-beijing.aliyuncs.com / oneprolabs).
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ needs.prepare-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ matrix.image_name }}:${{ needs.prepare-version.outputs.version }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ matrix.image_name }}:latest
          # Frontend args are ignored by the backend and lensnode builds.
          build-args: |
            USE_MIRROR=false
            APP_VERSION=${{ needs.prepare-version.outputs.version }}
            APP_RELEASE_DATE=${{ needs.prepare-version.outputs.release_date }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT }}
            VITE_GA_ID=${{ vars.VITE_GA_ID }}
          # Aliyun ACR rejects buildx's default OCI attestation manifests
          # (application/vnd.oci.empty.v1+json) with "unknown manifest class".
          # Disable provenance/SBOM so the same image pushes to both Docker Hub
          # and ACR; nothing in this repo consumes attestations.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - prepare-version
      - build-images
    if: ${{ startsWith(needs.prepare-version.outputs.ref, 'v') }}
    permissions:
      contents: write
    steps:
      - name: Download release-note artifacts
        uses: actions/download-artifact@v4
        with:
          name: >-
            release-notes-${{ needs.prepare-version.outputs.version }}
          path: release-artifacts

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ needs.prepare-version.outputs.ref }}
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_REF}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_REF}" \
              --title "SourceLens ${RELEASE_VERSION}" \
              --notes-file release-artifacts/release-notes.md
          else
            gh release create "${RELEASE_REF}" \
              --verify-tag \
              --title "SourceLens ${RELEASE_VERSION}" \
              --notes-file release-artifacts/release-notes.md
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      - prepare-version
      - build-images
    # Gate: auto-deploy runs only when the repo/environment variable
    # SOURCELENS_AUTO_DEPLOY is "true". It is intentionally left unset for the
    # first blue/green cutover, which is done manually and supervised on the
    # host; a tag push then only builds+pushes images. Set the variable to
    # "true" after the first cutover succeeds to make releases hands-off.
    if: ${{ vars.SOURCELENS_AUTO_DEPLOY == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail

      # No source or compose files are shipped from CI anymore: scripts/install.sh
      # self-fetches the small set of declarative deploy assets (compose file,
      # nginx/postgres config, the scripts themselves) straight from the public
      # repo at the release ref, then runs the health-gated blue/green switch. It
      # owns its own single-flight lock, so the ad-hoc lock the old inline script
      # kept is gone too.
      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          port: ${{ env.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Deploy to Server (blue/green install.sh)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          port: ${{ env.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3600s
          # Fail the job on the first failing command so a broken deploy (health
          # gate timing out, migration failing) surfaces as red, not a false
          # "success".
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}
            DEPLOY_REF="${{ needs.prepare-version.outputs.ref }}"
            echo "Bootstrapping scripts/install.sh at ${DEPLOY_REF}..."
            # Public repo: raw fetch needs no auth. Atomic write so a running
            # install.sh reading itself isn't truncated mid-run.
            mkdir -p scripts
            curl -fsSL \
              "https://raw.githubusercontent.com/HyperBDR/sourcelens/${DEPLOY_REF}/scripts/install.sh" \
              -o scripts/install.sh.tmp
            mv scripts/install.sh.tmp scripts/install.sh
            chmod +x scripts/install.sh
            # install.sh fetches the remaining assets, runs migrations against
            # the idle color, health-gates it, flips nginx (no dropped requests),
            # observes, retires the old color, then rolls the workers/lensnode.
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}" ./scripts/install.sh "${DEPLOY_REF}"

            echo "sourcelens blue/green deploy completed for ${DEPLOY_REF}"
