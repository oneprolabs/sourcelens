type: improvement
audience: user
en: >-
  Compact internal Q&A feedback without losing original user input, discover
  authorized integration tools on demand, and use reasoning effort appropriate
  to planning, execution and review. Batch adjacent streamed text while
  preserving output order and reconnect delivery.
zh-CN: >-
  压缩问答内部反馈并保留原始用户输入，按需发现已授权的集成工具，
  为规划、执行和审核使用相应思考强度。合并连续流式文本，保留输出顺序与断线重发能力。
