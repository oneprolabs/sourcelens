type: improvement
audience: admin
en: >-
  Added datasource-local file and heading navigation with optional PageIndex
  local PDF chapter trees, source validation, and workspace-search fallback.
  Retrieval metadata refreshes after synchronization and document conversion.
  No full-text chunks, embedding model, or vector database is required.
zh-CN: >-
  新增数据源本地文件目录与章节导航，可选使用 PageIndex local mode 生成 PDF
  章节树，支持来源校验和普通检索回退。同步与转换后刷新检索元数据，
  无需全文分块、Embedding 模型或向量数据库。
