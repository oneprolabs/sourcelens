type: improvement
audience: admin
en: >-
  MCP service accounts can use independent Bearer credentials through protected
  environment sets. Authorization headers retain their original spelling and
  secret values stay masked after binding or declaration changes. Connected
  services such as DevMind can expose quote and invoice queries with the filters
  and record fields supported by their tools and robot permissions. Assistants
  receive guidance to use remote queries, business dates and pagination, preserve
  record fields, and distinguish counts from amounts. Unavailable MCP services
  are reported while ordinary conversation remains available. MCP and gateway
  modules can be imported independently without a circular runtime dependency.
zh-CN: >-
  MCP 服务账号可通过受保护的环境配置集使用独立的访问令牌，Authorization
  请求头保留原始大小写；解绑或修改声明后，敏感值仍保持隐藏。
  对接 DevMind 等服务后，可按工具支持的条件和机器人权限查询报价单与票据。
  助手获得远程查询、业务日期筛选、分页及完整字段展示的指导，并区分条数与金额。
  MCP 服务不可用时会明确说明，普通对话仍可继续；MCP 与模型网关可独立导入。
