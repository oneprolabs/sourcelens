type: improvement
audience: admin
en: >-
  MCP service accounts can use independently configured Bearer credentials
  through protected environment sets. Authorization headers retain their
  original spelling, secret values stay masked during editing, and unavailable
  MCP services are reported without substituting unrelated workspace files.
  Legacy MCP OAuth grants are retired; migrate affected connections to Bearer
  credentials before deployment.
zh-CN: >-
  MCP 服务账号可通过受保护的环境配置集使用独立的 Bearer 凭证。
  Authorization 请求头保留原始大小写，编辑时密钥始终以掩码显示；
  MCP 服务不可用时会明确说明，不会用无关工作区文件代替查询结果。
  旧 MCP OAuth 授权将被清理，请在部署前将受影响连接迁移为 Bearer 凭证。
