type: feature
audience: admin
en: >-
  Added a built-in TypeSafe AI Plugin that exposes bounded Noul (yes/no),
  Choice, and Score decision tools. Administrators can connect a
  TypeSafe-compatible endpoint with a pinned Jev model; evaluations are
  size-bounded, fail closed, and keep the API token out of logs and Run
  snapshots.
zh-CN: >-
  新增内置 TypeSafe AI 插件，提供有界的 Noul（是/否）、Choice 和 Score
  决策工具。管理员可配置 TypeSafe 兼容端点并固定 Jev 模型；评估请求有
  大小限制、失败即关闭，且 API Token 不会出现在日志或 Run 快照中。
