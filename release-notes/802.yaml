type: feature
audience: admin
en: >-
  Agent Evaluation now snapshots every dataset revision, turns a completed Run
  into a baseline case, compares batches while listing what blocks a
  like-for-like reading, and records append-only human calibration of Judge
  verdicts. Batch reports also show per-metric coverage, suppressed aggregates,
  and the platform and LensNode versions that produced each result.
zh-CN: >-
  智能体评估现在为数据集保存不可变修订快照，可将已完成的 Run 固化为基线用例，
  在对比批次时明确列出哪些差异使两者不可直接比较，并支持对 Judge 结论追加人工校准。
  批次报告同时展示逐指标覆盖率、被抑制的综合分，以及产出结果时的平台与 LensNode 版本。
es: >-
  La evaluación de agentes ahora guarda revisiones inmutables de cada conjunto de
  datos, convierte un Run completado en un caso de referencia, compara lotes
  indicando qué impide una lectura equivalente y registra calibraciones humanas
  de solo adición sobre los veredictos del Judge. El informe también muestra la
  cobertura por métrica, los agregados suprimidos y las versiones de plataforma
  y LensNode que produjeron cada resultado.
