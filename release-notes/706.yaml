type: feature
audience: admin
en: Unified synchronization, processing and Q&A alerts with topic-based messages, personal email subscriptions, bounded diagnosis, multilingual notifications, native Feishu/WeCom/DingTalk targets, destination deduplication and retryable delivery records.
zh-CN: 统一同步、处理与问答告警，支持按主题发布消息、个人邮件订阅、限时限量诊断、多语言通知、飞书/企业微信/钉钉原生通知目标、目标去重与可重试的投递记录。
es: Alertas unificadas de sincronización, procesamiento y consultas con mensajes por temas, suscripciones personales por correo, diagnóstico limitado, notificaciones multilingües, destinos nativos de Feishu/WeCom/DingTalk, deduplicación e historial de entrega con reintentos.
