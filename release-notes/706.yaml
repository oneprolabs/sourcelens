type: feature
audience: admin
en: Unified synchronization, processing and Q&A alerts with topic-based message publication, personal email subscriptions, idempotency keys, destination deduplication and retryable delivery records.
zh-CN: 统一同步、处理与问答告警，新增按主题发布消息、个人邮件订阅、业务幂等键、通知目标去重与可重试的投递记录。
es: Alertas unificadas de sincronización, procesamiento y consultas con publicación por temas, suscripciones personales por correo, claves de idempotencia, deduplicación de destinos e historial de entrega con reintentos.
