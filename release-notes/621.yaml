type: improvement
audience: admin
en: >-
  Managed-workspace and upload datasources can now save and reuse their document
  conversion policy, so manual conversions honor the configured processing
  options instead of resetting to defaults.
zh-CN: >-
  托管工作区与上传类数据源现在可以保存并复用其文档转换策略，手动触发转换时会沿用已配置的处理选项，而不再回退到默认值。
